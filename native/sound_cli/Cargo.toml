[package]
name = "sound_cli"
version = "0.0.1"
edition = "2021"
description = "Native audio playback for CLI tools."
license = "MIT"
repository = "https://github.com/ManyMath/sound"

[lib]
# cdylib for FFI from Dart; staticlib for static linking (e.g. iOS) later;
# rlib so in-repo examples/tests can call the API directly.
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
# Pure-Rust multi-format decoding (wav/mp3/ogg-vorbis/flac) for less system deps.
symphonia = { version = "0.5", default-features = false, features = [
    "wav",
    "pcm",
    "mp3",
    "ogg",
    "vorbis",
    "flac",
] }

[dev-dependencies]
# Used by tests/examples to synthesize WAV input.
hound = "3.5"
# Pure-Rust FLAC encoder, to round-trip a real compressed format in tests.
flacenc = "0.4"

# Load the system audio library at runtime (libasound.so.2 on Linux,
# libaaudio.so on Android, AudioToolbox.framework on macOS/iOS) so we never
# need its dev headers/pkg-config at build time (honoring the
# no-system-dependencies constraint).
[target.'cfg(any(target_os = "linux", target_os = "android", target_os = "macos", target_os = "ios", target_os = "windows"))'.dependencies]
libloading = "0.8"
