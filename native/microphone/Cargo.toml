[package]
name = "microphone"
version = "0.0.1"
edition = "2021"
description = "Native audio recording."
license = "MIT"
repository = "https://github.com/ManyMath/microphone"

[lib]
# cdylib for FFI from Dart; staticlib for static linking (e.g. iOS); rlib so
# in-repo examples/tests can call the API directly.
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]

[dev-dependencies]
# Used by tests/examples to read back captured WAV bytes.
hound = "3.5"

# Load the system audio library at runtime (AudioToolbox.framework on macOS/iOS,
# libasound.so.2 on Linux, libaaudio.so on Android, winmm.dll on Windows) so we
# never need its dev headers/pkg-config at build time.
[target.'cfg(any(target_os = "linux", target_os = "android", target_os = "macos", target_os = "ios", target_os = "windows"))'.dependencies]
libloading = "0.8"
