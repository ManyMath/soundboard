name: soundboard_workspace
publish_to: none
environment:
  sdk: ^3.10.0
workspace:
  - packages/soundboard
  - packages/soundboard_flutter
  - apps/soundboard_example

dev_dependencies:
  melos: ^7.0.0
  yaml: ^3.1.3
  pub_semver: ^2.2.0
melos:
  name: soundboard
  scripts:
    analyze:
      run: dart analyze packages/soundboard && flutter analyze packages/soundboard_flutter && flutter analyze apps/soundboard_example
    format:
      run: dart format --output none --set-exit-if-changed packages/soundboard packages/soundboard_flutter/lib apps/soundboard_example/lib
    test:
      run: dart test packages/soundboard && flutter test packages/soundboard_flutter/test && flutter test apps/soundboard_example/test
