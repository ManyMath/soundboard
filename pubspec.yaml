name: soundboard_workspace
publish_to: none

# Dart pub workspace root. Member packages set `resolution: workspace` and
# share a single lockfile. Melos drives multi-package tooling on top of this.
# Members are added as packages are vendored (sound/microphone) and authored
# (packages/soundboard).
environment:
  sdk: ^3.10.0

dev_dependencies:
  melos: ^7.0.0

# Melos 7 reads its configuration from here (the pub-workspace root). Scripts
# mirror CI and use the right tool per package (dart vs flutter). They are
# fleshed out as workspace members are added.
melos:
  name: soundboard
