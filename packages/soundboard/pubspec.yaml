name: soundboard
description: >-
  Route and mix played sound into a microphone capture stream. Pure Dart on top
  of sound_dart, microphone_dart, and mixer_dart, with the goal of no
  additional system dependencies.
version: 0.0.1
repository: https://github.com/ManyMath/soundboard
issue_tracker: https://github.com/ManyMath/soundboard/issues
topics:
  - audio
  - microphone
  - sound
  - mixer

environment:
  sdk: ^3.10.0

resolution: workspace

dependencies:
  # For the CoreAudio and Windows virtual-mic FFI (coreaudio.dart,
  # windows.dart). Already in the workspace via sound_dart, so this adds no new
  # package to the project.
  ffi: ^2.1.0
  mixer_dart: ^0.0.1
  microphone_dart: ^0.0.2
  sound_dart: ^0.0.2

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.0
