<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>microphone_dart -- web capture example</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        margin: 3rem;
        line-height: 1.5;
      }
      button {
        font-size: 1.25rem;
        padding: 0.6rem 1.2rem;
        margin-right: 0.5rem;
      }
      #status {
        margin-top: 1.5rem;
        font-family: ui-monospace, monospace;
      }
    </style>
  </head>
  <body>
    <h1><code>microphone_dart</code> on the web</h1>
    <p>
      Click Record to capture from your microphone (the browser prompts for
      permission), then Stop to download the WAV. A user gesture is required
      before the browser grants microphone access.
    </p>
    <button id="record">Record</button>
    <button id="stop">Stop</button>
    <p id="status">Loading...</p>
    <script defer src="main.dart.js"></script>
  </body>
</html>
