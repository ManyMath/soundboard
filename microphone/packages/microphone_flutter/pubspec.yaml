name: microphone_flutter
description: >-
  Microphone recording for Flutter with the goal of no additional system 
  dependencies.  Integrates the `microphone_dart` package and uses cargokit 
  to build the native Rust audio library and use it via FFI.
version: 0.0.2
repository: https://github.com/ManyMath/microphone
issue_tracker: https://github.com/ManyMath/microphone/issues
topics:
  - audio
  - microphone
  - recording
  - ffi

environment:
  sdk: ^3.10.0
  flutter: '>=3.38.0'

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  microphone_dart: ^0.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        ffiPlugin: true
        # The Java side only handles the RECORD_AUDIO runtime permission;
        # capture itself goes over FFI.
        package: com.manymath.microphone_flutter
        pluginClass: MicrophoneFlutterPlugin
        dartPluginClass: MicrophoneFlutterAndroid
        dartFileName: src/android.dart
      ios:
        ffiPlugin: true
      linux:
        ffiPlugin: true
      macos:
        ffiPlugin: true
      windows:
        ffiPlugin: true
