name: microphone_flutter
description: >-
  Microphone recording for Flutter with the goal of no additional system 
  dependencies.  Integrates the `microphone_dart` package and uses cargokit 
  to build the native Rust audio library and use it via FFI.
version: 0.0.1
repository: https://github.com/ManyMath/microphone
issue_tracker: https://github.com/ManyMath/microphone/issues
topics:
  - audio
  - microphone
  - recording
  - ffi

environment:
  sdk: ^3.10.0
  flutter: '>=3.44.0'

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  microphone_dart: ^0.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        ffiPlugin: true
        # Capture goes over FFI; the Kotlin plugin only requests the
        # RECORD_AUDIO runtime permission, and registerWith hands it to
        # microphone_dart at startup.
        package: com.manymath.microphone_flutter
        pluginClass: MicrophoneFlutterPlugin
        dartPluginClass: MicrophoneFlutter
      ios:
        ffiPlugin: true
      linux:
        ffiPlugin: true
      macos:
        ffiPlugin: true
      windows:
        ffiPlugin: true
