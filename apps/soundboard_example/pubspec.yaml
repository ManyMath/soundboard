name: soundboard_example
description: >-
  Example Flutter app for the soundboard package: shows the OS-level virtual
  microphone device, plays test tones into it, and mixes a selected physical
  microphone into the mix. macOS uses the CoreAudio (BlackHole) virtual mic,
  Windows the VB-CABLE virtual cable, and Linux the PipeWire virtual mic.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.0

resolution: workspace

# soundboard_flutter re-exports the pure-Dart API and brings both native build
# plugins into the application transitively.
dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  soundboard_flutter: ^0.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
